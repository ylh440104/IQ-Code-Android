name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "ndk;29.0.13846066" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show outputs
        run: find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IQCode-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IQCode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
